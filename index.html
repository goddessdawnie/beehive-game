<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Beehive 🐝</title>
<style>
body{font:16px system-ui,sans-serif;background:#fff8eb;color:#392c23;max-width:700px;margin:24px auto;padding:0 16px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:2.4rem}section{background:#fff;border:1px solid #e7d9bd;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #7b612514}input,button,select{font:inherit;padding:10px;border-radius:10px;border:1px solid #cbbd9d;margin:4px}button{background:#f8d978;cursor:pointer}button:hover{background:#f2c94f}.hidden{display:none}.muted{color:#74695b}.pet{text-align:center;font-size:5rem}.task{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee4d3;padding:12px 0;flex-wrap:wrap}.task small{display:block;color:#74695b}#notice{color:#8b3c29}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button[aria-pressed="true"]{background:#e5b94b;font-weight:700}.task-status{font-size:.85rem;color:#74695b}.task-editor{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:end}.task-editor label{display:flex;flex-direction:column;gap:4px}.task-editor input{max-width:100%;box-sizing:border-box}.overdue{color:#a03f2b!important;font-weight:600}
</style></head>
<body><header><h1>🐝 Beehive</h1><button id="signout" class="hidden">Sign out</button></header>
<p class="muted">Little Caretaker · early prototype</p>
<section id="auth"><h2>Enter the hive</h2><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password"><p><button id="signin">Sign in</button><button id="signup">Create account</button></p><p class="muted">New accounts may need email confirmation.</p></section>
<main id="game" class="hidden"><section><div class="pet">🐈</div><h2 id="petname" style="text-align:center">Mochi</h2><p style="text-align:center"><button id="rename">Rename companion</button></p><p style="text-align:center"><b id="coins">0</b> 🪙 coins earned</p></section>
<section><h2>Your tasks</h2><form id="add"><input id="title" placeholder="Something to do" required><input id="due" type="datetime-local"><label>Repeat <select id="repeat"><option value="">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></label><button>Add</button></form><p class="muted">Today includes overdue tasks until their next recurrence. Defer skips one occurrence without penalty; Cancel stops a recurring series.</p><button id="refresh">Refresh</button><div class="filters" role="group" aria-label="Filter tasks"><button type="button" data-filter="today" aria-pressed="true">Today</button><button type="button" data-filter="anytime" aria-pressed="false">Anytime</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button><button type="button" data-filter="future" aria-pressed="false">Future</button></div><p id="taskcount" class="muted" aria-live="polite"></p><div id="tasks"></div></section></main><p id="notice" role="status"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const db=supabase.createClient('https://kyfyzrtsksybnrrlnhmj.supabase.co','sb_publishable_ER9TbRzYW05miP8TkHcdaQ_zjr6NuGk');
const el=id=>document.getElementById(id),notice=s=>el('notice').textContent=s;let pet=null;
let loading=false, reloadRequested=false,taskFilter='today';
async function load(){if(loading){reloadRequested=true;return;}loading=true;try{await loadInner();}finally{loading=false;if(reloadRequested){reloadRequested=false;void load();}}}
async function loadInner(){const {data:{user}}=await db.auth.getUser();el('auth').classList.toggle('hidden',!!user);el('game').classList.toggle('hidden',!user);el('signout').classList.toggle('hidden',!user);if(!user)return;
const rolled=await db.rpc('roll_forward_daily_tasks');if(rolled.error){notice(rolled.error.message);return}const [tasks,rewards,pets]=await Promise.all([db.from('tasks').select('*').order('created_at',{ascending:false}),db.from('reward_ledger').select('coins_delta'),db.from('pet_state').select('*').maybeSingle()]);
for(const r of [tasks,rewards,pets])if(r.error){notice(r.error.message);return}
pet=pets.data;if(!pet){const r=await db.from('pet_state').insert({name:'Mochi'}).select().single();if(r.error){if(r.error.code==='23505'){const existing=await db.from('pet_state').select('*').maybeSingle();if(existing.error||!existing.data){notice(existing.error?.message||'Unable to load existing companion');return}pet=existing.data;}else{notice(r.error.message);return}}else pet=r.data}
el('petname').textContent=pet.name;el('coins').textContent=(rewards.data||[]).reduce((n,r)=>n+r.coins_delta,0);
const todayStart=new Date();todayStart.setHours(0,0,0,0);const tomorrow=new Date(todayStart);tomorrow.setDate(tomorrow.getDate()+1);
const belongs=(t,tab)=>{if(tab==='completed')return ['completed','cancelled','deferred'].includes(t.status);if(t.status!=='open')return false;if(tab==='anytime')return !t.due_at;if(!t.due_at)return false;const due=new Date(t.due_at);return tab==='today'?due<tomorrow:due>=tomorrow};
const counts={today:0,anytime:0,completed:0,future:0};for(const t of tasks.data)for(const tab of Object.keys(counts))if(belongs(t,tab))counts[tab]++;
document.querySelectorAll('[data-filter]').forEach(b=>{const tab=b.dataset.filter;b.textContent=({today:'Today',anytime:'Anytime',completed:'Completed',future:'Future'})[tab]+' ('+counts[tab]+')'});
const visible=tasks.data.filter(t=>belongs(t,taskFilter)).sort((a,b)=>{if(taskFilter==='completed')return new Date(b.completed_at||b.updated_at||b.created_at)-new Date(a.completed_at||a.updated_at||a.created_at);if(a.due_at&&b.due_at)return new Date(a.due_at)-new Date(b.due_at);return new Date(b.created_at)-new Date(a.created_at)});
el('taskcount').textContent=visible.length+' tasks in '+taskFilter;el('tasks').replaceChildren();if(!visible.length){const empty=document.createElement('p');empty.className='muted';empty.textContent=({today:'Nothing due today. Suspiciously peaceful.',anytime:'No anytime tasks.',completed:'No completed, deferred, or cancelled tasks yet.',future:'Nothing scheduled for later.'})[taskFilter];el('tasks').append(empty)}
for(const t of visible){const row=document.createElement('div');row.className='task';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=t.title;const detail=document.createElement('small');const overdue=t.status==='open'&&t.due_at&&new Date(t.due_at)<todayStart;detail.textContent=(overdue?'Past due · ':'')+t.status+' · '+(t.due_at?new Date(t.due_at).toLocaleString():'Someday')+(t.recurrence_rule?' · repeats '+t.recurrence_rule:'')+' · '+t.reward_coins+' coins';if(overdue)detail.classList.add('overdue');info.append(name,detail);const controls=document.createElement('div');
const button=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;controls.append(b)};
if(t.status==='open'){button('Done',()=>setStatus(t.id,'completed'));if(t.recurrence_rule)button('Defer',()=>setStatus(t.id,'deferred'));if(t.recurrence_rule)button('Stop repeating',()=>stopSeries(t.id));else button('Cancel',()=>setStatus(t.id,'cancelled'));button('Edit',()=>{if(row.querySelector('form'))return;const form=document.createElement('form');form.className='task-editor';const label=document.createElement('label');label.textContent='Task name ';const title=document.createElement('input');title.value=t.title;title.required=true;title.maxLength=250;label.append(title);const dateLabel=document.createElement('label');dateLabel.textContent='Due date (optional) ';const date=document.createElement('input');date.type='datetime-local';if(t.due_at){const d=new Date(t.due_at),local=new Date(d.getTime()-d.getTimezoneOffset()*60000);date.value=local.toISOString().slice(0,16)}dateLabel.append(date);const save=document.createElement('button');save.type='submit';save.textContent='Save';const clear=document.createElement('button');clear.type='button';clear.textContent='Clear date';clear.onclick=()=>{date.value=''};const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Close';cancel.onclick=()=>form.remove();form.append(label,dateLabel,save,clear,cancel);form.onsubmit=async e=>{e.preventDefault();if(!title.value.trim())return;const due=date.value?new Date(date.value).toISOString():null;if(t.recurrence_rule&&!due){notice('Recurring tasks need a due date.');return}const r=await db.from('tasks').update({title:title.value.trim(),due_at:due,updated_at:new Date().toISOString()}).eq('id',t.id);notice(r.error?.message||'Task updated');if(!r.error)await load()};row.append(form)})}else if(t.status==='completed')button('Undo',()=>setStatus(t.id,'open'));else if(t.status==='cancelled')button('Reopen',()=>setStatus(t.id,'open'));
row.append(info,controls);el('tasks').append(row)}}
async function stopSeries(id){if(!confirm('Stop this recurring task? Future occurrences will be cancelled.'))return;const r=await db.rpc('stop_recurring_series',{p_task_id:id});notice(r.error?.message||'Recurring task stopped');await load()}
async function setStatus(id,value){const r=await db.rpc('set_task_status',{p_task_id:id,p_status:value});notice(r.error?.message||'');await load()}
el('signin').onclick=async()=>{const r=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});notice(r.error?.message||'Signed in');await load()};
el('signup').onclick=async()=>{const r=await db.auth.signUp({email:el('email').value,password:el('password').value,options:{emailRedirectTo:location.origin+location.pathname}});notice(r.error?.message||'Check your email to confirm your account.');await load()};
el('signout').onclick=async()=>{await db.auth.signOut();await load()};
el('add').onsubmit=async e=>{e.preventDefault();const due=el('due').value;const repeat=el('repeat').value;if(repeat&&!due){notice('Recurring tasks need a first date and time.');return}const r=await db.from('tasks').insert({title:el('title').value.trim(),due_at:due?new Date(due).toISOString():null,recurrence_rule:repeat||null,recurrence_series_id:repeat?crypto.randomUUID():null});notice(r.error?.message||'');if(!r.error)el('add').reset();await load()};
el('rename').onclick=async()=>{const name=prompt('Companion name',pet.name);if(!name?.trim())return;const r=await db.from('pet_state').update({name:name.trim()}).eq('id',pet.id);notice(r.error?.message||'');await load()};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));void load()});
el('refresh').onclick=load;db.auth.onAuthStateChange(()=>setTimeout(load,0));load();
</script></body></html>
