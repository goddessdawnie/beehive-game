<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Ornate plum silk dragon cushion with gold piping and tassels">
<defs>
 <linearGradient id="silkTop" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#b383c4"/><stop offset=".24" stop-color="#824e9d"/><stop offset=".62" stop-color="#653c83"/><stop offset="1" stop-color="#3e285e"/></linearGradient>
 <linearGradient id="silkFront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#754585"/><stop offset=".55" stop-color="#512d6a"/><stop offset="1" stop-color="#2f2046"/></linearGradient>
 <linearGradient id="cord" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fff1b5"/><stop offset=".42" stop-color="#d9af58"/><stop offset=".8" stop-color="#a47336"/><stop offset="1" stop-color="#f4d88a"/></linearGradient>
 <radialGradient id="shine"><stop stop-color="#e5b6e3" stop-opacity=".5"/><stop offset="1" stop-color="#e5b6e3" stop-opacity="0"/></radialGradient>
