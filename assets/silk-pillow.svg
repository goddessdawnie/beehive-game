 <path d="M69 139Q41 156 30 182" fill="none"/><path d="M30 176L16 199M30 176L30 205M30 176L45 199" fill="none" stroke="#dfb85c" stroke-width="6"/>
 <path d="M571 139Q598 156 611 182" fill="none"/><path d="M610 176L594 198M610 176L612 205M610 176L627 197" fill="none" stroke="#dfb85c" stroke-width="6"/>
</g>
<path d="M49 106Q72 68 169 61Q320 32 470 61Q568 67 591 106L587 163Q562 205 438 207Q318 215 198 207Q77 202 53 163Z" fill="url(#silkFront)" stroke="#3c254a" stroke-width="5"/>
<path d="M56 142Q103 170 197 174Q322 188 445 174Q552 168 584 142" fill="none" stroke="url(#cord)" stroke-width="10" stroke-linecap="round"/>
<path d="M56 148Q110 172 201 177Q326 190 442 177Q543 172 583 148" fill="none" stroke="#ffe7a1" stroke-opacity=".55" stroke-width="2.5"/>
