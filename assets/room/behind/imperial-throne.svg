<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" role="img" aria-label="Dark carved wooden imperial throne with plum upholstery and antique gold trim">
<defs>
 <linearGradient id="mahogany" x1="0" y1="0" x2=".85" y2="1">
  <stop stop-color="#21151b"/><stop offset=".35" stop-color="#5c3338"/><stop offset=".7" stop-color="#412329"/><stop offset="1" stop-color="#1c151c"/>
 </linearGradient>
 <linearGradient id="woodedge" x1="0" y1="0" x2="1" y2=".2">
  <stop stop-color="#25181f"/><stop offset=".25" stop-color="#895346"/><stop offset=".52" stop-color="#49262c"/><stop offset=".79" stop-color="#734237"/><stop offset="1" stop-color="#21151b"/>
 </linearGradient>
 <linearGradient id="velvet" x1="0" y1="0" x2=".75" y2="1">
  <stop stop-color="#a66eaf"/><stop offset=".23" stop-color="#784786"/><stop offset=".62" stop-color="#4c2a66"/><stop offset="1" stop-color="#2e1d49"/>
 </linearGradient>
 <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#b681bb"/><stop offset=".34" stop-color="#754688"/><stop offset="1" stop-color="#3c244f"/>
 </linearGradient>
 <linearGradient id="brass" x1="0" y1="0" x2=".9" y2="1">
  <stop stop-color="#fff1b0"/><stop offset=".25" stop-color="#d8af62"/><stop offset=".6" stop-color="#916034"/><stop offset=".86" stop-color="#efd18b"/><stop offset="1" stop-color="#85542d"/>
 </linearGradient>
 <radialGradient id="velvetLight" cx=".28" cy=".16" r=".9">
  <stop stop-color="#d9a6d5" stop-opacity=".32"/><stop offset="1" stop-color="#d9a6d5" stop-opacity="0"/>
 </radialGradient>
</defs>
<!-- Everything outside the throne is transparent, preserving the chamber wall. -->
<!-- Splayed feet and supports; sculpted wood remains visible either side of Kae. -->
<path d="M75 478 L111 480 L101 558 L57 569 Q48 560 61 549 L78 540Z M289 480 L325 478 L341 546 Q353 561 337 568 L297 556Z" fill="url(#woodedge)" stroke="#1a1119" stroke-width="6"/>
<path d="M65 557 L100 546 M299 546 L338 557" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>
<!-- Carved outer back: elevated crest, tall gently tapered sides. -->
<path d="M57 468 Q42 407 47 311 L45 168 Q44 104 91 79 Q127 58 152 64 L172 30 Q181 14 199 10 Q218 14 228 30 L250 64 Q286 55 318 83 Q357 115 354 176 L351 316 Q359 407 339 470 L307 489 L92 489Z" fill="url(#mahogany)" stroke="#1b1119" stroke-width="10" stroke-linejoin="round"/>
<!-- Antique gold inlay traces the high arched silhouette. -->
<path d="M66 422 L64 166 Q62 109 107 91 Q146 71 164 80 L181 49 Q190 30 200 28 Q210 30 219 49 L236 80 Q270 72 302 96 Q336 120 334 175 L332 422" fill="none" stroke="url(#brass)" stroke-width="8" stroke-linecap="round"/>
<!-- Upholstered back, with rounded shoulders, a taper at the base, and raised perimeter piping. -->
<path d="M99 442 Q87 367 88 200 Q89 139 121 124 Q147 112 166 114 Q180 86 200 86 Q220 86 234 114 Q269 108 289 128 Q313 151 312 202 Q314 371 302 442 Q206 472 99 442Z" fill="url(#velvet)" stroke="#291933" stroke-width="9"/>
<path d="M99 442 Q87 367 88 200 Q89 139 121 124 Q147 112 166 114 Q180 86 200 86 Q220 86 234 114 Q269 108 289 128 Q313 151 312 202 Q314 371 302 442 Q206 472 99 442Z" fill="url(#velvetLight)"/>
<path d="M107 422 Q99 334 100 197 Q101 144 130 135 Q158 124 175 128 Q189 100 201 101 Q214 101 228 129 Q270 122 287 154 Q302 187 300 222 L295 422" fill="none" stroke="#d7a7d5" stroke-opacity=".43" stroke-width="5"/>
<!-- Subtle tufting keeps this regal, not gaudy. -->
<g fill="#e4bf82" fill-opacity=".62">
 <circle cx="158" cy="211" r="3.4"/><circle cx="244" cy="211" r="3.4"/>
 <circle cx="200" cy="285" r="3.4"/><circle cx="158" cy="355" r="3.4"/><circle cx="242" cy="355" r="3.4"/>
</g>
<g fill="none" stroke="#dca6d5" stroke-width="2" opacity=".22">
 <path d="M158 211 Q183 258 200 285 Q222 244 244 211"/>
 <path d="M158 355 Q180 320 200 285 Q222 321 242 355"/>
</g>
<!-- A modest crest with carved curled tendrils, not an enormous crown. -->
<path d="M167 68 Q179 51 200 55 Q221 51 233 68" fill="none" stroke="url(#brass)" stroke-width="6"/>
<path d="M176 69 Q166 54 154 54 M224 69 Q234 54 246 54" fill="none" stroke="#ba884a" stroke-width="4" stroke-linecap="round"/>
<path d="M188 61 L200 43 L212 61 L200 79Z" fill="#6e385c" stroke="url(#brass)" stroke-width="4"/>
<path d="M181 94 Q200 105 219 94" fill="none" stroke="#ddbb74" stroke-opacity=".6" stroke-width="3"/>
<!-- Seat cushion and raised, dark carved armrests. They stay behind Kae by chamber z-index. -->
<path d="M83 440 Q195 419 319 440 L306 489 Q200 507 98 489Z" fill="url(#seat)" stroke="#291a2e" stroke-width="8"/>
<path d="M96 481 Q201 497 304 481" fill="none" stroke="url(#brass)" stroke-width="5" opacity=".9"/>
<path d="M49 380 Q64 347 88 360 Q115 371 121 418 L123 472 L95 487 L66 468 Q59 432 49 380Z" fill="url(#woodedge)" stroke="#24171c" stroke-width="7"/>
<path d="M351 380 Q336 347 312 360 Q285 371 279 418 L277 472 L305 487 L334 468 Q341 432 351 380Z" fill="url(#woodedge)" stroke="#24171c" stroke-width="7"/>
<path d="M64 380 Q83 367 103 400 M336 380 Q317 367 297 400" fill="none" stroke="url(#brass)" stroke-width="5" stroke-linecap="round"/>
<path d="M69 470 L84 505 M331 470 L316 505" stroke="#a97645" stroke-width="5"/>
</svg>
